<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Basic Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1 class="title">Calculator</h1>
  </header>
  <main class="calculator">
    <div class="screen">
      <div id="preview" class="preview"></div>
      <div id="display" class="display">0</div>
    </div>

    <div class="keys">
      <button data-action="clear" class="key wide">C</button>
      <button data-action="back" class="key">⌫</button>
      <button data-action="op" data-value="/" class="key">÷</button>

      <button class="key">7</button>
      <button class="key">8</button>
      <button class="key">9</button>
      <button data-action="op" data-value="*" class="key">×</button>

      <button class="key">4</button>
      <button class="key">5</button>
      <button class="key">6</button>
      <button data-action="op" data-value="-" class="key">−</button>

      <button class="key">1</button>
      <button class="key">2</button>
      <button class="key">3</button>
      <button data-action="op" data-value="+" class="key">+</button>

      <button class="key zero">0</button>
      <button class="key">.</button>
      <button data-action="equals" class="key">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
